name: Engine Tests

on:
  push:

jobs:
  test:
    name: Run Engine Unit Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    # Same pinned SDK setup as android.yml — the runner ships cmdline-tools
    # that matches; skip extra packages so sdkmanager does not try to install
    # the removed legacy "tools" package.
    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        cmdline-tools-version: 11076708   # 12.0 — matches the runner's preinstalled tools
        packages: ''
        accept-android-sdk-licenses: true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Engine Unit Tests
      run: |
        ./gradlew testDebugUnitTest --stacktrace

    - name: Upload Test Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-reports
        path: |
          app/build/reports/tests/**/*
          app/build/test-results/**/*
        if-no-files-found: warn