name: Android CI

on:
  push:

jobs:
  build:
    name: Build & Compile Android App
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    # android-actions/setup-android defaults to installing the legacy "tools"
    # package, which Google removed from the SDK repository (sdkmanager exits 1
    # with "Failed to find package 'tools'"). Pin @v4, skip extra packages
    # (the runner already ships platform-tools), and reuse the preinstalled
    # cmdline-tools 12.0 instead of downloading 20.0.
    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        cmdline-tools-version: 11076708   # 12.0 — matches the runner's preinstalled tools
        packages: ''
        accept-android-sdk-licenses: true

    - name: Install NDK
      run: |
        sdkmanager --install "ndk;28.2.13676358" --channel=0

    - name: Decode or Generate Debug Keystore
      env:
        DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
      run: |
        if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
          echo "Decoding debug keystore from GitHub Actions Secret DEBUG_KEYSTORE_BASE64..."
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
        elif [ -f "debug.keystore.base64" ]; then
          echo "Decoding debug.keystore.base64 file..."
          base64 -d debug.keystore.base64 > debug.keystore
        elif [ -f "debug.keystore" ]; then
          echo "debug.keystore already exists."
        else
          echo "debug.keystore not found. Generating a new debug keystore..."
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Release APK
      run: |
        ./gradlew assembleRelease -Pandroid.builder.sdkDownload=true --stacktrace

    - name: Delete Old GitHub Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release delete latest --yes || true
        git push --delete origin latest || true
        git tag -d latest || true

    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Find Release APK file
        APK_FILES=$(find app/build/outputs/apk/release/ -name "*.apk" -type f)
        if [ -n "$APK_FILES" ]; then
          gh release create latest $APK_FILES \
            --title "Latest Release" \
            --notes "Automated release build signed with debug keystore." \
            --prerelease
        else
          echo "No Release APK found to release!"
          exit 1
        fi
